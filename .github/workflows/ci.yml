name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
          POSTGRES_DB: aether
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aether"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Same image under the C locale: the fold tests must hold under both.
      postgres-c:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
          POSTGRES_DB: aether
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U aether"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://aether:aether@localhost:5432/aether
      SQLX_OFFLINE: "true"
      ORT_DYLIB_PATH: /opt/aether/ort/libonnxruntime.so.1.22.0
      CI: "true"
      # No test reaches the real network: aether-net panics on any host but this machine.
      AETHER_NET_DENY_REAL: "1"
      # The workspace test build outgrew the runner's free disk (run 44370344775 died with
      # "No space left on device"). Full debuginfo is the bulk of target/; line tables keep backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The input-snapshot tests need FICLONE, which the runner's ext4 lacks; they fail loudly
      # without it (docs/m4-input-snapshots.md). Give them a real reflink filesystem (loop XFS,
      # reflink=1) owned by the runner user instead of skipping them, and prove a clone works.
      - name: Reflink filesystem for the input-snapshot tests
        run: |
          sudo apt-get install -y xfsprogs
          img="$RUNNER_TEMP/aether-reflink.img"
          truncate -s 2G "$img"
          mkfs.xfs -q -m reflink=1 "$img"
          sudo mkdir -p /mnt/aether-reflink
          sudo mount -o loop "$img" /mnt/aether-reflink
          sudo chown "$(id -u):$(id -g)" /mnt/aether-reflink
          echo probe > /mnt/aether-reflink/probe
          cp --reflink=always /mnt/aether-reflink/probe /mnt/aether-reflink/probe.clone
          rm /mnt/aether-reflink/probe /mnt/aether-reflink/probe.clone
          findmnt /mnt/aether-reflink
          echo "AETHER_TEST_REFLINK_DIR=/mnt/aether-reflink" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build pinned patched dynamic libsoxr (private prefix)
        run: |
          sudo apt-get install -y gcc make cmake patch curl xz-utils binutils libgomp1
          sh scripts/build-soxr.sh "$RUNNER_TEMP/aether-soxr"
          printf 'LIBRARY_PATH=%s/lib\nLD_LIBRARY_PATH=%s/lib\n' "$RUNNER_TEMP/aether-soxr" "$RUNNER_TEMP/aether-soxr" >> "$GITHUB_ENV"
      - name: Provision verified CPU ONNX Runtime (linux/amd64)
        run: |
          sudo install -d -o root -g root -m 755 /opt/aether
          sudo sh scripts/acquire-ort.sh /opt/aether/ort
          python3 scripts/test-ort-packaging.py
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Per-profile keys grep gate (M-PROF, D-240)
        run: tools/check-profile-keys.sh
      - name: Native soxr linkage checker self-test
        env:
          TMPDIR: ${{ runner.temp }}
        run: sh scripts/test-soxr-linkage.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Native cold-process and independent waveform regressions, both feature sets
        run: |
          cargo test --locked -p aether-ml --test clap_cold_start --test clap_prepare
          cargo test --locked -p aether-ml --features pg-publish --test clap_cold_start --test clap_prepare
          python3 - <<'PY'
          import json, os, subprocess
          # Ask Cargo where the test binaries are: since Cargo's build-dir layout (stable 2026-11) they
          # are no longer under target/debug/deps.
          for features in ([], ['--features', 'pg-publish']):
              out = subprocess.run(
                  ['cargo', 'test', '--locked', '-p', 'aether-ml', *features, '--test', 'clap_cold_start',
                   '--test', 'clap_prepare', '--no-run', '--message-format=json'],
                  check=True, capture_output=True, text=True).stdout
              found = {}
              for line in out.splitlines():
                  msg = json.loads(line)
                  if msg.get('reason') == 'compiler-artifact' and msg.get('executable') and msg['target']['name'] in ('clap_cold_start', 'clap_prepare'):
                      found[msg['target']['name']] = msg['executable']
              assert set(found) == {'clap_cold_start', 'clap_prepare'}, found
              for binary in found.values():
                  subprocess.run(['sh', 'scripts/check-soxr-linkage.sh', binary, os.environ['RUNNER_TEMP'] + '/aether-soxr'], check=True)
          PY
      # Failing test lines also go out as annotations, readable without log access.
      - run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log || {
            grep -A2 -E 'panicked at|FAILED|^---- |left:|right:|Error' test.log | head -80 | sed 's/^/::error::/'
            exit 1
          }
      - run: DATABASE_URL=postgres://aether:aether@localhost:5433/aether cargo test -p aether-api --test login_limit
      - run: DATABASE_URL=postgres://aether:aether@localhost:5433/aether cargo test -p aether-subsonic --test auth
  # aether-web is the only frontend. Next.js is in no CI path and the repository no longer bundles it: visual
  # comparisons use an external kima-hub checkout through tools/run-aether-web-visual.sh (D-180).
  aether-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
          POSTGRES_DB: aether
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aether"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://aether:aether@localhost:5432/aether
      SQLX_OFFLINE: "true"
      AETHER_NET_DENY_REAL: "1"
    steps:
      - uses: actions/checkout@v5
      # aether-web builds on stable and nightly (see crates/aether-web/README.md); nightly keeps parity with dev.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # aether-server links aether-ml (via aether-ident), which needs the pinned dynamic libsoxr.
      - name: Build pinned patched dynamic libsoxr (private prefix)
        run: |
          sudo apt-get install -y gcc make cmake patch curl xz-utils binutils libgomp1
          sh scripts/build-soxr.sh "$RUNNER_TEMP/aether-soxr"
          printf 'LIBRARY_PATH=%s/lib\nLD_LIBRARY_PATH=%s/lib\n' "$RUNNER_TEMP/aether-soxr" "$RUNNER_TEMP/aether-soxr" >> "$GITHUB_ENV"
      # wasm-opt (binaryen) is required by `vertigo build`; apt's binaryen is too old, use the release.
      - name: Install wasm-opt
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - run: tools/verify-wasm-toolchain.sh
      - run: cargo fmt -p aether-web --check
      # Proves aether-api-types stays wasm-buildable.
      - run: cargo build -p aether-api-types --target wasm32-unknown-unknown
      - run: cargo clippy -p aether-web --all-targets -- -D warnings
      - run: cargo clippy -p aether-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p aether-web
      # Node is used ONLY here: aether.css is a checked-in Tailwind output, so a stale one must fail. The three
      # packages are installed at exact versions in an isolated dir by the same script local runs use; the build
      # and runtime paths never use Node.
      - name: Stale aether.css guard
        run: |
          tools/install-aether-web-css-deps.sh "$RUNNER_TEMP/tailwind"
          AETHER_CSS_DEPS="$RUNNER_TEMP/tailwind" node tools/gen-aether-web-css.mjs --check
      - run: cargo install vertigo-cli --version 0.14.5 --locked
      - run: tools/verify-aether-web-build.sh
      # The embedded SSR tests render the real build; a missing build is a failure here, not a skip.
      - run: AETHER_WEB_REQUIRE_BUILD=1 cargo test -p aether-server --test web_ssr_embed
