services:
  aether:
    build: .
    image: aether:dev
    ports:
      - "3030:3030"
    volumes:
      # Read-write on purpose (M4 embeddings): the private snapshot directory lives on the SAME
      # mount as the library, because a reflink cannot cross mounts. See docs/m4-input-snapshots.md.
      - ${MUSIC_DIR:-./music}:/music
      - aether_data:/data
      # Organizer copy mode: uncomment, point at a writable folder, and set AETHER_ORGANIZE_TARGET.
      # - ${ORGANIZE_DIR:-./organized}:/organized
    environment:
      # Private (0700, aether-owned) directory on the library mount; created by the entrypoint.
      # The library scanner skips dot-prefixed directories, so it is never indexed.
      - AETHER_SNAPSHOT_DIR=/music/.aether-snapshots
      # - AETHER_ORGANIZE_TARGET=/organized
    restart: unless-stopped
    # aether drains for up to 10 s, then the bundled Postgres needs time to stop cleanly.
    stop_grace_period: 30s
volumes:
  aether_data: {}
